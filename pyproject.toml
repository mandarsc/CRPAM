[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crpam"
version = "0.1.0"
description = "Causal Relationship Prediction in Additive noise Models (CRPAM): supervised causal discovery with kernel mean embeddings"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mandar Chaudhary" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "joblib>=1.2",
    "pandas>=2.0",
]

[project.optional-dependencies]
baselines = ["causal-learn>=0.1.3"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "causal-learn>=0.1.3", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
